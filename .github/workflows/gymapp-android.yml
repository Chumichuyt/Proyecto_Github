name: GymApp Android APK

on:
  push:
    paths:
      - "GymApp/**"
      - ".github/workflows/gymapp-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GymApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Tests
        run: ./gradlew testReleaseUnitTest --no-daemon
      - name: Compilar APK
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GymBeast-apk
          path: GymApp/app/build/outputs/apk/release/app-release.apk
